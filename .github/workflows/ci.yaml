name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Instalar herramientas
        run: |
          scripts/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: make lint

  e2e:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Instalar herramientas
        run: |
          scripts/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make doctor
      - run: make up
      - run: make deploy
      - run: make smoke
      - name: Diagnóstico si falla
        if: failure()
        run: |
          kubectl --context kind-boutique get pods -A -o wide
          kubectl --context kind-boutique -n boutique get events --sort-by=.lastTimestamp | tail -50
      - name: Limpiar
        if: always()
        run: make down
