# Cluster local: 1 control-plane + 2 workers.
# La versión de Kubernetes queda fijada por la versión de kind (scripts/install-tools.sh).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels:
      lab.role: control-plane
  - role: worker
    labels:
      lab.role: apps
  - role: worker
    labels:
      lab.role: apps
